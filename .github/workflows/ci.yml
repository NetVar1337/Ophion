name: tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract assertions
        shell: pwsh
        run: ./tests/contracts.ps1
      - name: Build x64 probe
        shell: pwsh
        run: ./tools/build-probe.ps1 -Configuration Release -WarningsAsErrors
